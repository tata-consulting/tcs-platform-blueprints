apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: tcs-backstage-idp
  title: TCS Backstage IDP blueprint
  description: Bootstrap an internal developer platform service with a catalog entry and delivery metadata.
spec:
  owner: group:default/platform-engineering
  type: service
  parameters:
    - title: Service metadata
      required:
        - serviceName
        - owner
      properties:
        serviceName:
          type: string
          title: Service name
        owner:
          type: string
          title: Owner group
        tier:
          type: string
          title: Service tier
          default: tier-2
  steps:
    - id: fetch-base
      name: Fetch base
      action: fetch:template
      input:
        url: ./skeleton
        values:
          serviceName: ${{ parameters.serviceName }}
          owner: ${{ parameters.owner }}
          tier: ${{ parameters.tier }}
    - id: publish
      name: Publish
      action: publish:github
      input:
        description: Service bootstrapped from the TCS platform blueprint
        repoUrl: github.com?owner=tata-consulting&repo=${{ parameters.serviceName }}
    - id: register
      name: Register in catalog
      action: catalog:register
      input:
        repoContentsUrl: ${{ steps.publish.output.repoContentsUrl }}
        catalogInfoPath: /catalog-info.yaml
  output:
    links:
      - title: Repository
        url: ${{ steps.publish.output.remoteUrl }}
